# 모든 환경 공통 설정. 환경별 값은 application-{profile}.yml 에 둔다.
spring:
  application:
    name: family-care
  profiles:
    default: local
  jpa:
    open-in-view: false          # 트랜잭션 밖(뷰 렌더링)에서 지연 로딩 금지
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway가 만들고, Hibernate는 검증만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
