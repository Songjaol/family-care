# 로컬 개발용 MySQL. 실행: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: family-care-mysql
    environment:
      MYSQL_DATABASE: family_care
      MYSQL_USER: family_care
      MYSQL_PASSWORD: family_care
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
